<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiReset Pro · Titanium Suite</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment-with-locales.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --c1: #00D4FF; --c2: #7B2FFF; --c3: #FF2D78; --c4: #00FF88; --c5: #FFB800;
    --bg0: #020408; --bg1: #080C14; --bg2: #0D1420; --bg3: #12182A;
    --glass: rgba(255,255,255,0.04); --glass2: rgba(255,255,255,0.07);
    --border0: rgba(255,255,255,0.05); --border1: rgba(255,255,255,0.10);
    --border2: rgba(0,212,255,0.25); --text0: #F0F6FF; --text1: #8BA4C0; --text2: #3D5A80;
    --sw: 280px; --th: 64px; --r1: 12px; --r2: 18px; --r3: 24px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg0);color:var(--text0);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}

/* BACKGROUND IMAGE WITH ANIMATION */
#bgScene {position:fixed;inset:0;z-index:0;overflow:hidden;}
#bgImage {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(0.45) saturate(1.3);transform-origin:center center;animation:bgBreath 20s ease-in-out infinite alternate;}
@keyframes bgBreath {from{transform:scale(1.0)}to{transform:scale(1.07)}}
#bgScene::after {content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(2,4,8,0.7) 100%);pointer-events:none;z-index:2;}

/* FX CANVAS */
#fxCanvas {position:fixed;inset:0;z-index:1;pointer-events:none;}

/* AMBIENT ORBS */
.ambient{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:2;animation:ambientFloat 10s ease-in-out infinite alternate}
.ambient-1{width:400px;height:400px;background:rgba(0,212,255,0.06);top:-15%;left:-8%;animation-duration:12s}
.ambient-2{width:300px;height:300px;background:rgba(123,47,255,0.06);bottom:-10%;right:-5%;animation-duration:14s;animation-delay:-4s}
@keyframes ambientFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-25px) scale(1.15)}}

/* SIDEBAR */
aside{width:var(--sw);background:linear-gradient(180deg,rgba(8,12,20,0.92) 0%,rgba(13,20,32,0.92) 100%);border-right:1px solid var(--border0);display:flex;flex-direction:column;padding:24px 14px;flex-shrink:0;z-index:50;position:relative;backdrop-filter:blur(30px)}
aside::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--c1),var(--c2),transparent);opacity:.5;animation:sideGlow 4s ease-in-out infinite alternate}
@keyframes sideGlow{from{opacity:.2}to{opacity:.7}}
.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 24px;margin-bottom:8px;border-bottom:1px solid var(--border0);position:relative}
.brand-logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;animation:logoGlow 3s ease-in-out infinite;box-shadow:0 0 0 0 rgba(0,212,255,.5)}
@keyframes logoGlow{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,.5),0 0 20px rgba(0,212,255,.2)}50%{box-shadow:0 0 0 10px rgba(0,212,255,0),0 0 40px rgba(0,212,255,.5)}}
.brand-logo i{color:#fff;font-size:18px;z-index:2;position:relative}
.brand-logo::before{content:'';position:absolute;inset:-1px;border-radius:14px;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));z-index:0;animation:borderSpin 5s linear infinite}
.brand-logo::after{content:'';position:absolute;inset:2px;border-radius:11px;background:linear-gradient(135deg,#0D1E3A,#1A0E3A);z-index:1}
@keyframes borderSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.brand-text{flex:1}
.brand-name{font-family:'Exo 2',sans-serif;font-size:16px;font-weight:900;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.03em}
.brand-ver{font-size:9px;font-weight:600;color:var(--text2);letter-spacing:.15em;text-transform:uppercase;margin-top:1px}
.nav-group-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text2);padding:0 10px;margin:16px 0 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r1);color:var(--text1);cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);margin-bottom:2px;font-size:13px;font-weight:500;border:1px solid transparent;position:relative;overflow:hidden}
.nav-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0;background:var(--c1);transform:scaleY(0);transition:transform .3s ease}
.nav-item:hover{color:var(--text0);background:var(--glass2);transform:translateX(5px);border-color:var(--border1)}
.nav-item.active{color:var(--c1);background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.2);transform:translateX(5px)}
.nav-item.active::before{transform:scaleY(1)}
.nav-item.active-w{color:var(--c2);background:rgba(123,47,255,.08);border-color:rgba(123,47,255,.2);transform:translateX(5px)}
.nav-item.active-w::before{background:var(--c2);transform:scaleY(1)}
.nav-item.active-s{color:var(--c4);background:rgba(0,255,136,.08);border-color:rgba(0,255,136,.2);transform:translateX(5px)}
.nav-item.active-s::before{background:var(--c4);transform:scaleY(1)}
.nav-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--glass);transition:all .3s ease}
.nav-item.active .nav-icon{background:rgba(0,212,255,.15);color:var(--c1)}
.nav-item.active-w .nav-icon{background:rgba(123,47,255,.15);color:var(--c2)}
.nav-item.active-s .nav-icon{background:rgba(0,255,136,.15);color:var(--c4)}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border0)}
.sys-info{display:flex;align-items:center;gap:6px;padding:8px 10px;margin-top:10px}
.sys-dot{width:6px;height:6px;border-radius:50%;background:var(--c4);animation:sysBlink 2s ease-in-out infinite}
@keyframes sysBlink{0%,100%{opacity:1;box-shadow:0 0 4px var(--c4)}50%{opacity:.3;box-shadow:none}}
.sys-text{font-size:9px;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;font-weight:600}

/* TOPBAR */
.topbar{height:var(--th);background:rgba(8,12,20,0.85);border-bottom:1px solid var(--border0);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;flex-shrink:0;backdrop-filter:blur(30px);position:relative;z-index:40}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--c1),var(--c2),var(--c3),transparent);animation:topbarLine 4s linear infinite;background-size:200% 100%}
@keyframes topbarLine{from{background-position:0% 0%}to{background-position:200% 0%}}
.topbar-left{display:flex;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}
.badge-on{background:rgba(0,255,136,.08);color:var(--c4);border:1px solid rgba(0,255,136,.2)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:sysBlink 2s infinite}
.topbar-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border1);background:var(--glass);color:var(--text1);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .25s ease}
.icon-btn:hover{color:var(--c1);border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.08);transform:scale(1.08)}

/* MAIN */
main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:10}
.content{flex:1;overflow-y:auto;padding:2rem;scrollbar-width:thin;scrollbar-color:rgba(0,212,255,.2) transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:2px}
.panel{display:none}
.panel.active{display:block;animation:panelIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* CARDS */
.gcard{background:var(--glass);border:1px solid var(--border0);border-radius:var(--r3);padding:2rem;margin-bottom:1.25rem;backdrop-filter:blur(25px);position:relative;overflow:hidden;transition:border-color .35s,transform .35s,box-shadow .35s}
.gcard:hover{border-color:var(--border1);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.gcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,255,.5),transparent);opacity:0;transition:opacity .35s}
.gcard:hover::before{opacity:1}
.wiki-card{background:var(--glass);border:1px solid var(--border0);border-radius:var(--r2);padding:1.5rem;margin-bottom:1rem;border-top:2px solid var(--c2);position:relative;overflow:hidden;transition:all .35s cubic-bezier(.34,1.56,.64,1);backdrop-filter:blur(20px)}
.wiki-card:hover{transform:translateY(-4px) scale(1.008);border-color:rgba(123,47,255,.4);box-shadow:0 20px 56px rgba(123,47,255,.1)}
.wiki-card-name{font-family:'Exo 2',sans-serif;font-size:16px;font-weight:700;color:var(--text0)}
.wiki-steps-box{background:rgba(0,0,0,.35);border:1px solid var(--border0);border-left:3px solid var(--c2);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.8;white-space:pre-wrap;color:var(--text1);margin-bottom:12px}

/* FORMATTER */
.fmt-hero{text-align:center;padding:1rem 0 2rem}
.fmt-title{font-family:'Exo 2',sans-serif;font-size:36px;font-weight:900;letter-spacing:-.04em;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradShift 4s ease infinite;margin-bottom:6px}
.fmt-sub{font-size:13px;color:var(--text2)}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.fmt-result-wrap{text-align:center;margin-top:1.5rem;animation:resultPop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes resultPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.fmt-result-num{font-family:'JetBrains Mono',monospace;font-size:4.5rem;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(0,212,255,.5));letter-spacing:.05em}
.fmt-error-box{background:rgba(255,45,120,.08);border:1px solid rgba(255,45,120,.2);color:var(--c3);border-radius:10px;padding:12px 16px;font-size:13px;margin-top:1rem;font-weight:600}

/* INPUTS */
.field-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);display:block;margin-bottom:7px}
.inp{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--border1);border-radius:10px;padding:11px 14px;font-size:14px;font-family:'Outfit',sans-serif;color:var(--text0);outline:none;transition:all .3s}
.inp:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,212,255,.12),0 0 24px rgba(0,212,255,.08)}
.inp::placeholder{color:var(--text2)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.65}
.form-row{margin-bottom:14px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border1);background:var(--glass);color:var(--text1);font-family:'Outfit',sans-serif;transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.btn:hover{color:var(--text0);transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;box-shadow:0 4px 24px rgba(0,212,255,.3)}
.btn-primary:hover{box-shadow:0 8px 36px rgba(0,212,255,.5);color:#fff}
.btn-cyan{background:linear-gradient(135deg,rgba(0,212,255,.22),rgba(0,150,200,.16));color:var(--c1);border-color:rgba(0,212,255,.3)}
.btn-purple{background:linear-gradient(135deg,rgba(123,47,255,.25),rgba(90,30,200,.2));color:var(--c2);border-color:rgba(123,47,255,.3)}
.btn-green{background:linear-gradient(135deg,rgba(0,255,136,.22),rgba(0,180,100,.16));color:var(--c4);border-color:rgba(0,255,136,.3)}
.btn-full{width:100%;justify-content:center;padding:14px 20px;font-size:14px}
.btn-icon{width:38px;height:38px;padding:0;justify-content:center;border-radius:10px;flex-shrink:0}
.btn-cancel{background:none;border:none;color:var(--text2);font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif;padding:8px;transition:color .2s}
.btn-cancel:hover{color:var(--c3)}
.form-panel{background:var(--glass);border:1px solid var(--border1);border-radius:var(--r2);padding:1.5rem;margin-bottom:1.25rem;display:none;backdrop-filter:blur(20px)}
.form-panel.open{display:block;animation:panelIn .35s ease}
.form-panel-title{font-family:'Exo 2',sans-serif;font-size:15px;font-weight:700;margin-bottom:1rem}
.form-actions{display:flex;gap:8px;margin-top:14px}
.search-bar{display:flex;gap:10px;margin-bottom:1.5rem;align-items:center}
.search-wrap{position:relative;flex:1}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:13px;transition:color .3s}
.search-inp{width:100%;background:rgba(0,0,0,.55);border:1px solid var(--border1);border-radius:50px;padding:13px 18px 13px 44px;font-size:14px;font-family:'Outfit',sans-serif;color:var(--text0);outline:none;transition:all .3s}
.search-inp:focus{border-color:var(--c2);box-shadow:0 0 0 3px rgba(123,47,255,.1)}
.video-thumb{width:100%;border-radius:12px;overflow:hidden;position:relative;aspect-ratio:16/9;background:#000;cursor:pointer;margin-bottom:12px}
.video-thumb img{width:100%;height:100%;object-fit:cover;opacity:.7;transition:all .35s}
.video-thumb:hover img{opacity:.9;transform:scale(1.03)}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;background:linear-gradient(135deg,var(--c2),var(--c1));border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:0 0 28px rgba(123,47,255,.5);animation:playPulse 2s ease-in-out infinite}
@keyframes playPulse{0%,100%{box-shadow:0 0 0 0 rgba(123,47,255,.5)}50%{box-shadow:0 0 0 16px rgba(123,47,255,0)}}
.admin-actions{display:flex;gap:6px;flex-shrink:0}
.btn-ed,.btn-dl{width:30px;height:30px;border:none;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s}
.btn-ed{background:rgba(0,212,255,.1);color:var(--c1)}
.btn-ed:hover{background:rgba(0,212,255,.2);transform:scale(1.1)}
.btn-dl{background:rgba(255,45,120,.1);color:var(--c3)}
.btn-dl:hover{background:rgba(255,45,120,.2);transform:scale(1.1)}
#toast{visibility:hidden;background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(123,47,255,.18));border:1px solid rgba(0,212,255,.35);color:var(--text0);text-align:center;padding:12px 24px;border-radius:50px;position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:2000;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,212,255,.25);backdrop-filter:blur(25px)}
#toast.show{visibility:visible;animation:toastPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes toastPop{from{opacity:0;bottom:0;transform:translateX(-50%) scale(.8)}to{opacity:1;bottom:28px;transform:translateX(-50%) scale(1)}}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty-state i{font-size:3rem;margin-bottom:12px;opacity:.2;display:block}

/* SHARE PANEL */
.share-header{text-align:center;padding:1.5rem 0;margin-bottom:1rem}
.share-header-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,rgba(0,255,136,.15),rgba(0,212,255,.1));display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:28px;color:var(--c4);border:1px solid rgba(0,255,136,.2)}
.share-title{font-family:'Exo 2',sans-serif;font-size:24px;font-weight:800;color:var(--text0);margin-bottom:6px}
.share-subtitle{font-size:13px;color:var(--text1);max-width:500px;margin:0 auto;line-height:1.6}
.share-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,255,136,.08);color:var(--c4);border:1px solid rgba(0,255,136,.2);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:.06em;margin-top:12px}
.share-card{background:var(--glass);border:1px solid var(--border0);border-radius:var(--r2);padding:1.5rem;margin-bottom:1rem;border-top:2px solid var(--c4);position:relative;overflow:hidden;backdrop-filter:blur(20px);transition:all .3s ease}
.share-card:hover{border-color:rgba(0,255,136,.3);box-shadow:0 12px 40px rgba(0,255,136,.06)}
.share-card .wiki-card-name{color:var(--c4)}

/* READONLY BAR */
.readonly-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;background:linear-gradient(90deg,rgba(0,212,255,.1),rgba(123,47,255,.1));border-top:1px solid rgba(0,212,255,.2);backdrop-filter:blur(20px);padding:9px 20px;text-align:center;font-size:11.5px;font-weight:600;color:var(--text1);animation:slideUp .4s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* STATISTICS PANEL */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-top:1.5rem}
.stat-card{background:var(--glass2);border:1px solid var(--border1);border-radius:var(--r1);padding:1.25rem;text-align:center;backdrop-filter:blur(20px);transition:all .3s ease}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,212,255,.1)}
.stat-number{font-family:'JetBrains Mono',monospace;font-size:2.2rem;font-weight:700;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-top:6px}
.stat-bar-track{width:100%;height:8px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden;margin-top:6px}
.stat-bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.stat-brand-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stat-brand-name{font-size:12px;font-weight:600;color:var(--text1);min-width:80px}
.stat-brand-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);min-width:24px;text-align:right}

/* BRAND BADGES */
.brand-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.05em;color:#fff;margin-left:8px;vertical-align:middle;text-transform:uppercase;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.brand-filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem;align-items:center}
.brand-filter-btn{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border1);background:var(--glass);color:var(--text1);font-family:'Outfit',sans-serif;transition:all .25s ease}
.brand-filter-btn:hover{color:var(--text0);border-color:var(--border2);background:var(--glass2)}
.brand-filter-btn.active{background:rgba(0,212,255,.15);color:var(--c1);border-color:rgba(0,212,255,.3)}

/* UNDO TOAST */
.toast-undo{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;margin-left:14px;border-radius:20px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s ease}
.toast-undo:hover{background:rgba(255,255,255,.25);transform:scale(1.05)}

/* WIKI CARD DELETING ANIMATION */
.wiki-card.deleting{opacity:0;transform:scale(.95) translateX(20px);transition:all .4s ease;pointer-events:none}

/* STATS NAV ACTIVE STATE */
.nav-item.active-st{color:var(--c1);background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.2);transform:translateX(5px)}
.nav-item.active-st::before{background:var(--c1);transform:scaleY(1)}
.nav-item.active-st .nav-icon{background:rgba(0,212,255,.15);color:var(--c1)}

/* ═══════════════════════════════════════════
   LIGHT THEME
   ═══════════════════════════════════════════ */
[data-theme="light"] {
    --bg0: #F0F4FA; --bg1: #E4EAF4; --bg2: #D8E0EE; --bg3: #CCD6E6;
    --glass: rgba(255,255,255,0.65); --glass2: rgba(255,255,255,0.85);
    --border0: rgba(0,40,120,0.08); --border1: rgba(0,40,120,0.14);
    --border2: rgba(0,120,255,0.35);
    --text0: #0A1628; --text1: #3A5070; --text2: #7A94B4;
}
body[data-theme="light"] { background: var(--bg0); }
body[data-theme="light"] #bgImage { filter: brightness(0.7) saturate(1.2); }
body[data-theme="light"] #bgScene::after { background: radial-gradient(ellipse at 50% 40%,transparent 30%,rgba(240,244,250,0.6) 100%); }
body[data-theme="light"] aside { background: linear-gradient(180deg,rgba(228,234,244,0.95) 0%,rgba(216,224,238,0.95) 100%); border-right-color: var(--border1); }
body[data-theme="light"] aside::after { background: linear-gradient(180deg,transparent,var(--c1),var(--c2),transparent); }
body[data-theme="light"] .nav-item { color: var(--text1); }
body[data-theme="light"] .nav-item:hover { color: var(--text0); background: rgba(0,120,255,0.06); border-color: var(--border1); }
body[data-theme="light"] .nav-item.active { color: var(--c1); background: rgba(0,120,255,0.08); border-color: rgba(0,120,255,0.2); }
body[data-theme="light"] .nav-item.active-w { color: var(--c2); background: rgba(123,47,255,0.08); border-color: rgba(123,47,255,0.2); }
body[data-theme="light"] .nav-item.active-s { color: #009960; background: rgba(0,180,100,0.08); border-color: rgba(0,180,100,0.2); }
body[data-theme="light"] .topbar { background: rgba(228,234,244,0.92); border-bottom-color: var(--border1); }
body[data-theme="light"] .brand-logo::after { background: linear-gradient(135deg,#E8F0FF,#D8D0FF); }
body[data-theme="light"] .brand-name { background: linear-gradient(135deg,#0080DD,#6030DD); -webkit-background-clip:text; }
body[data-theme="light"] .sys-text { color: var(--text2); }
body[data-theme="light"] .gcard { background: var(--glass); border-color: var(--border1); box-shadow: 0 2px 12px rgba(0,20,80,0.06); }
body[data-theme="light"] .gcard:hover { box-shadow: 0 12px 40px rgba(0,20,80,0.1); }
body[data-theme="light"] .wiki-card { background: var(--glass); border-color: var(--border1); border-top-color: var(--c2); box-shadow: 0 2px 12px rgba(0,20,80,0.06); }
body[data-theme="light"] .wiki-card:hover { box-shadow: 0 12px 36px rgba(123,47,255,0.08); }
body[data-theme="light"] .wiki-steps-box { background: rgba(0,20,80,0.04); border-color: var(--border1); color: var(--text1); }
body[data-theme="light"] .share-card { background: var(--glass); border-color: var(--border1); box-shadow: 0 2px 12px rgba(0,20,80,0.06); }
body[data-theme="light"] .share-card:hover { box-shadow: 0 12px 36px rgba(0,180,100,0.08); }
body[data-theme="light"] .inp, body[data-theme="light"] .search-inp { background: rgba(255,255,255,0.7); border-color: var(--border1); color: var(--text0); }
body[data-theme="light"] .inp:focus, body[data-theme="light"] .search-inp:focus { border-color: var(--c1); box-shadow: 0 0 0 3px rgba(0,120,255,0.1); }
body[data-theme="light"] .inp::placeholder, body[data-theme="light"] .search-inp::placeholder { color: var(--text2); }
body[data-theme="light"] .form-panel { background: var(--glass); border-color: var(--border1); box-shadow: 0 4px 20px rgba(0,20,80,0.06); }
body[data-theme="light"] .btn { border-color: var(--border1); background: rgba(255,255,255,0.6); }
body[data-theme="light"] .btn-primary { background: linear-gradient(135deg,var(--c1),var(--c2)); color: #fff; border: none; }
body[data-theme="light"] .btn-ed { background: rgba(0,120,255,0.1); color: #0080DD; }
body[data-theme="light"] .btn-dl { background: rgba(255,45,120,0.1); color: #DD2070; }
body[data-theme="light"] .badge-on { background: rgba(0,180,100,0.08); color: #009960; border-color: rgba(0,180,100,0.2); }
body[data-theme="light"] .icon-btn { border-color: var(--border1); background: rgba(255,255,255,0.5); color: var(--text1); }
body[data-theme="light"] .icon-btn:hover { color: var(--c1); border-color: rgba(0,120,255,0.3); background: rgba(0,120,255,0.06); }
body[data-theme="light"] #toast { background: linear-gradient(135deg,rgba(0,120,255,0.12),rgba(123,47,255,0.12)); border-color: rgba(0,120,255,0.25); color: var(--text0); box-shadow: 0 8px 32px rgba(0,20,80,0.12); }
body[data-theme="light"] .readonly-bar { background: linear-gradient(90deg,rgba(0,120,255,0.08),rgba(123,47,255,0.08)); border-top-color: rgba(0,120,255,0.15); color: var(--text1); }
body[data-theme="light"] .nav-group-label { color: var(--text2); }
body[data-theme="light"] .nav-icon { background: rgba(0,40,120,0.04); }
body[data-theme="light"] .share-header-icon { background: linear-gradient(135deg,rgba(0,180,100,0.1),rgba(0,120,255,0.08)); border-color: rgba(0,180,100,0.2); }
body[data-theme="light"] .share-badge { background: rgba(0,180,100,0.08); color: #009960; border-color: rgba(0,180,100,0.2); }
body[data-theme="light"] .sidebar-footer { border-top-color: var(--border1); }
body[data-theme="light"] .content::-webkit-scrollbar-thumb { background: rgba(0,120,255,0.15); }
body[data-theme="light"] .ambient { opacity: 0.4; }
body[data-theme="light"] .empty-state { color: var(--text2); }
body[data-theme="light"] .stat-card { background: var(--glass); border-color: var(--border1); box-shadow: 0 2px 10px rgba(0,20,80,0.05); }
body[data-theme="light"] .stat-card:hover { box-shadow: 0 8px 24px rgba(0,20,80,0.08); }
body[data-theme="light"] .brand-badge { box-shadow: 0 2px 6px rgba(0,20,80,0.1); }
body[data-theme="light"] .brand-filter-btn { background: rgba(255,255,255,0.6); border-color: var(--border1); color: var(--text1); }
body[data-theme="light"] .brand-filter-btn:hover { background: rgba(255,255,255,0.8); color: var(--text0); }
body[data-theme="light"] .brand-filter-btn.active { background: rgba(0,120,255,0.1); color: var(--c1); border-color: rgba(0,120,255,0.3); }
body[data-theme="light"] .stat-bar-track { background: rgba(0,20,80,0.08); }
body[data-theme="light"] .toast-undo { background: rgba(0,40,120,0.1); border-color: rgba(0,40,120,0.2); color: var(--text0); }
body[data-theme="light"] .nav-item.active-st { color: var(--c1); background: rgba(0,120,255,0.08); border-color: rgba(0,120,255,0.2); }
body[data-theme="light"] .stat-brand-name { color: var(--text1); }
body[data-theme="light"] .stat-brand-count { color: var(--text2); }

/* FAVORITES / PINS */
.btn-fav{width:30px;height:30px;border:none;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;background:rgba(255,184,0,.08);color:var(--text2)}
.btn-fav:hover{background:rgba(255,184,0,.18);transform:scale(1.15)}
.btn-fav.is-fav{color:#FFB800;background:rgba(255,184,0,.18);text-shadow:0 0 8px rgba(255,184,0,.5)}
.btn-fav.is-fav:hover{background:rgba(255,184,0,.3);transform:scale(1.15)}
.wiki-card.pinned{border-top-color:#FFB800;box-shadow:0 0 0 1px rgba(255,184,0,.15),0 8px 30px rgba(255,184,0,.08)}
.wiki-card.pinned .wiki-card-name::before{content:'\f005';font-family:'Font Awesome 6 Free';font-weight:900;font-size:11px;margin-right:6px;color:#FFB800;vertical-align:middle}
body[data-theme="light"] .btn-fav{background:rgba(255,184,0,.1);color:var(--text2)}
body[data-theme="light"] .btn-fav.is-fav{color:#CC9200;background:rgba(255,184,0,.15)}
body[data-theme="light"] .wiki-card.pinned{border-top-color:#CC9200;box-shadow:0 0 0 1px rgba(255,184,0,.1),0 6px 20px rgba(0,20,80,.06)}

/* SEARCH HIGHLIGHT */
mark{background:#FFB800;color:#000;border-radius:3px;padding:0 2px;font-weight:700;box-shadow:0 0 8px rgba(255,184,0,.3)}
body[data-theme="light"] mark{background:#FFE066;color:#0A1628;box-shadow:0 0 6px rgba(255,184,0,.25)}
</style>

<script>
// ═══════════════════════════════════════════
//   CANVAS FX: OPTIMIZED CLOUDS + BUTTERFLY
// ═══════════════════════════════════════════
(function(){
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let W, H, time = 0, lastTime = performance.now();

    function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // Optimized clouds (6 instead of 8)
    const clouds = [];
    const CLOUD_COUNT = 6;

    class Cloud {
        constructor(x){
            this.x = x !== undefined ? x : Math.random() * W * 1.5;
            this.y = H * (0.05 + Math.random() * 0.22);
            this.speed = 18 + Math.random() * 22;
            this.scale = 0.6 + Math.random() * 1.1;
            this.alpha = 0.18 + Math.random() * 0.22;
            this.puffs = [];
            const n = 4 + Math.floor(Math.random() * 3);
            for(let i=0;i<n;i++){
                this.puffs.push({
                    ox: (i - n/2) * (40 + Math.random()*20),
                    oy: (Math.random()-0.5)*18,
                    r:  28 + Math.random()*30
                });
            }
        }
        update(dt){ this.x += this.speed * dt; if(this.x > W + 400) this.x = -400 - Math.random()*200; }
        draw(ctx){
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.translate(this.x, this.y);
            ctx.scale(this.scale, this.scale);
            const grad = ctx.createRadialGradient(0, -10, 5, 0, 0, 80);
            grad.addColorStop(0, 'rgba(255,255,255,0.95)');
            grad.addColorStop(0.5,'rgba(220,235,255,0.7)');
            grad.addColorStop(1, 'rgba(180,210,255,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            this.puffs.forEach((p,i)=>{
                if(i===0) ctx.moveTo(p.ox + p.r, p.oy);
                ctx.arc(p.ox, p.oy, p.r, 0, Math.PI*2);
            });
            ctx.fill();
            ctx.restore();
        }
    }

    for(let i=0;i<CLOUD_COUNT;i++) clouds.push(new Cloud(Math.random() * W * 1.4 - W*0.2));

    // Optimized butterfly + particles (60 instead of 120)
    let butterfly = { x: W*0.55, y: H*0.35, vx:0, vy:0, phase:0, wingPhase:0, alive:true, alpha:1 };
    let particles = [];
    let bfState = 'fly';
    let bfTimer = 0;
    const BF_FLY_DURATION    = 5;
    const BF_DISSOLVE_TIME   = 1.2;
    const BF_WAIT_TIME       = 2.5;
    const BF_REFORM_TIME     = 1.5;

    function spawnParticles(){
        particles = [];
        const count = 60;
        for(let i=0;i<count;i++){
            const angle = Math.random()*Math.PI*2;
            const speed = 60 + Math.random()*160;
            particles.push({
                x: butterfly.x, y: butterfly.y,
                vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 40,
                alpha: 0.9 + Math.random()*0.1,
                size:  2 + Math.random()*5,
                r: 30 + Math.floor(Math.random()*80),
                g: 100 + Math.floor(Math.random()*80),
                b: 200 + Math.floor(Math.random()*55),
                life: 1
            });
        }
    }

    function drawButterfly(ctx, x, y, wingOpen, alpha){
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(x, y);
        const w = wingOpen;
        ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-w*0.6,-w*0.8,-w*1.1,-w*0.2,-w*0.3,w*0.25);
        const gL=ctx.createLinearGradient(-w*0.8,-w*0.4,0,w*0.2);gL.addColorStop(0,'rgba(80,160,255,0.85)');gL.addColorStop(0.5,'rgba(120,80,255,0.7)');gL.addColorStop(1,'rgba(40,200,255,0.5)');ctx.fillStyle=gL;ctx.fill();
        ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(w*0.6,-w*0.8,w*1.1,-w*0.2,w*0.3,w*0.25);
        const gR=ctx.createLinearGradient(w*0.8,-w*0.4,0,w*0.2);gR.addColorStop(0,'rgba(80,160,255,0.85)');gR.addColorStop(0.5,'rgba(120,80,255,0.7)');gR.addColorStop(1,'rgba(40,200,255,0.5)');ctx.fillStyle=gR;ctx.fill();
        ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-w*0.5,w*0.5,-w*0.7,w*0.9,-w*0.15,w*0.55);ctx.fillStyle='rgba(60,140,255,0.55)';ctx.fill();
        ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(w*0.5,w*0.5,w*0.7,w*0.9,w*0.15,w*0.55);ctx.fillStyle='rgba(60,140,255,0.55)';ctx.fill();
        ctx.beginPath();ctx.ellipse(0,0.2*w,w*0.07,w*0.35,0,0,Math.PI*2);ctx.fillStyle='rgba(20,20,60,0.85)';ctx.fill();
        ctx.globalAlpha=alpha*0.4;[-1,1].forEach(side=>{ctx.beginPath();ctx.arc(side*w*0.5,-w*0.25,w*0.12,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();ctx.beginPath();ctx.arc(side*w*0.35,w*0.15,w*0.07,0,Math.PI*2);ctx.fillStyle='rgba(200,230,255,0.7)';ctx.fill();});
        ctx.restore();
    }

    function animate(now){
        const dt = Math.min((now - lastTime)/1000, 0.1);
        lastTime = now; time += dt;
        ctx.clearRect(0,0,W,H);
        clouds.forEach(c=>{ c.update(dt); c.draw(ctx); });
        bfTimer += dt;

        if(bfState==='fly'){
            butterfly.phase+=dt*0.6;const cx=W*0.52,cy=H*0.32;const tx=cx+Math.sin(butterfly.phase*1.1)*W*0.12;const ty=cy+Math.sin(butterfly.phase*0.7)*H*0.08;butterfly.x+=(tx-butterfly.x)*2.5*dt;butterfly.y+=(ty-butterfly.y)*2.5*dt;butterfly.wingPhase+=dt*5.5;const wingOpen=22+Math.sin(butterfly.wingPhase)*14;drawButterfly(ctx,butterfly.x,butterfly.y,wingOpen,butterfly.alpha);
            if(bfTimer>=BF_FLY_DURATION){bfTimer=0;bfState='dissolve';spawnParticles();}
        }else if(bfState==='dissolve'){
            const p=Math.min(bfTimer/BF_DISSOLVE_TIME,1);butterfly.wingPhase+=dt*8;const wingOpen=22+Math.sin(butterfly.wingPhase)*14;drawButterfly(ctx,butterfly.x,butterfly.y,wingOpen,(1-p)*0.9);
            particles.forEach(pt=>{pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=30*dt;pt.vx*=0.97;pt.life=1-p;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size*pt.life,0,Math.PI*2);ctx.fillStyle=`rgba(${pt.r},${pt.g},${pt.b},${pt.alpha*pt.life*0.9})`;ctx.shadowColor=`rgba(${pt.r},${pt.g},${pt.b},0.8)`;ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;});
            if(p>=1){bfTimer=0;bfState='wait';}
        }else if(bfState==='wait'){
            const p=Math.min(bfTimer/BF_WAIT_TIME,1);particles.forEach(pt=>{pt.x+=pt.vx*dt*0.1;pt.y+=pt.vy*dt*0.1;const a=(1-p)*pt.alpha*0.5;if(a>0.01){ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size*(1-p*0.6),0,Math.PI*2);ctx.fillStyle=`rgba(${pt.r},${pt.g},${pt.b},${a})`;ctx.fill();}});
            if(p>=1){bfTimer=0;bfState='reform';butterfly.x=W*(0.4+Math.random()*0.2);butterfly.y=H*(0.25+Math.random()*0.15);particles.forEach(pt=>{pt.x=butterfly.x+(Math.random()-0.5)*40;pt.y=butterfly.y+(Math.random()-0.5)*40;});}
        }else if(bfState==='reform'){
            const p=Math.min(bfTimer/BF_REFORM_TIME,1);particles.forEach(pt=>{pt.x+=(butterfly.x-pt.x)*4*dt;pt.y+=(butterfly.y-pt.y)*4*dt;const a=p*pt.alpha*0.8;const s=pt.size*(1-p*0.7);if(a>0.01){ctx.beginPath();ctx.arc(pt.x,pt.y,s,0,Math.PI*2);ctx.fillStyle=`rgba(${pt.r},${pt.g},${pt.b},${a})`;ctx.shadowColor=`rgba(${pt.r},${pt.g},${pt.b},0.9)`;ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;}});
            butterfly.wingPhase+=dt*6;const wingOpen=22+Math.sin(butterfly.wingPhase)*14;drawButterfly(ctx,butterfly.x,butterfly.y,wingOpen,p*0.95);
            if(p>=1){bfTimer=0;bfState='fly';butterfly.phase=Math.random()*Math.PI*2;}
        }
        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
})();

// ═══════════════════════════════════════════
//   CLICK PARTICLE FX
// ═══════════════════════════════════════════
(function(){
    const cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:fixed;inset:0;z-index:9998;pointer-events:none;';
    document.body.appendChild(cvs);
    const ctx = cvs.getContext('2d');
    let cw, ch;
    function resizeCvs(){ cw = cvs.width = window.innerWidth; ch = cvs.height = window.innerHeight; }
    window.addEventListener('resize', resizeCvs);
    resizeCvs();

    const clickParticles = [];
    const COLORS = [
        [0,120,255], [0,160,255], [0,200,255],
        [0,212,255], [30,80,255], [60,140,255],
        [80,170,255], [100,190,255], [0,100,230],
        [20,60,220], [50,120,240], [0,180,255]
    ];

    document.addEventListener('click', function(e){
        const count = 28 + Math.floor(Math.random()*14);
        for(let i=0;i<count;i++){
            const angle = (Math.PI*2/count)*i + (Math.random()-0.5)*0.6;
            const speed = 80 + Math.random()*220;
            const c = COLORS[Math.floor(Math.random()*COLORS.length)];
            clickParticles.push({
                x: e.clientX,
                y: e.clientY,
                vx: Math.cos(angle)*speed,
                vy: Math.sin(angle)*speed,
                size: 2 + Math.random()*4,
                r: c[0], g: c[1], b: c[2],
                alpha: 0.9 + Math.random()*0.1,
                life: 1,
                decay: 0.6 + Math.random()*0.8,
                gravity: 120 + Math.random()*80,
                trail: Math.random() > 0.5
            });
        }
        // Sparkle ring
        for(let i=0;i<8;i++){
            const angle = (Math.PI*2/8)*i;
            const speed = 30 + Math.random()*40;
            clickParticles.push({
                x: e.clientX,
                y: e.clientY,
                vx: Math.cos(angle)*speed,
                vy: Math.sin(angle)*speed,
                size: 6 + Math.random()*4,
                r: 150, g: 210, b: 255,
                alpha: 1,
                life: 1,
                decay: 2.0,
                gravity: 0,
                trail: false,
                isStar: true
            });
        }
    });

    let lastT = performance.now();
    function animClicks(now){
        const dt = Math.min((now - lastT)/1000, 0.05);
        lastT = now;
        ctx.clearRect(0,0,cw,ch);

        for(let i = clickParticles.length - 1; i >= 0; i--){
            const p = clickParticles[i];
            p.life -= p.decay * dt;
            if(p.life <= 0){ clickParticles.splice(i,1); continue; }

            p.vy += p.gravity * dt;
            p.vx *= 0.985;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            const a = p.alpha * p.life;
            const sz = p.size * (p.isStar ? p.life : (0.3 + p.life*0.7));

            if(p.isStar){
                // Draw 4-point star
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.life * 3);
                ctx.beginPath();
                const outerR = sz * 2;
                const innerR = sz * 0.5;
                for(let j=0;j<8;j++){
                    const r = j%2===0 ? outerR : innerR;
                    const ang = (Math.PI*2/8)*j - Math.PI/2;
                    if(j===0) ctx.moveTo(Math.cos(ang)*r, Math.sin(ang)*r);
                    else ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
                }
                ctx.closePath();
                ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
                ctx.shadowColor = `rgba(${p.r},${p.g},${p.b},0.8)`;
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.restore();
            } else {
                // Draw glow circle
                ctx.beginPath();
                ctx.arc(p.x, p.y, sz, 0, Math.PI*2);
                ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
                ctx.shadowColor = `rgba(${p.r},${p.g},${p.b},0.6)`;
                ctx.shadowBlur = 8;
                ctx.fill();

                // Trail effect
                if(p.trail && p.life > 0.3){
                    ctx.beginPath();
                    ctx.arc(p.x - p.vx*dt*0.5, p.y - p.vy*dt*0.5, sz*0.6, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a*0.4})`;
                    ctx.shadowBlur = 4;
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0;
        }
        requestAnimationFrame(animClicks);
    }
    requestAnimationFrame(animClicks);
})();
</script>

<script>
// ═══════════════════════════════════════════
//   BLUE CURSOR TRAIL FX
// ═══════════════════════════════════════════
(function(){
    const cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:fixed;inset:0;z-index:9997;pointer-events:none;';
    document.body.appendChild(cvs);
    const ctx = cvs.getContext('2d');
    let tw, th;
    function resizeTrail(){ tw = cvs.width = window.innerWidth; th = cvs.height = window.innerHeight; }
    window.addEventListener('resize', resizeTrail);
    resizeTrail();

    // Trail points array (~30 points)
    const trail = [];
    const MAX_TRAIL = 30;
    let mouseX = -100, mouseY = -100;

    // Track mouse movement
    document.addEventListener('mousemove', function(e){
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    // Blue color palette for the trail
    const TRAIL_COLORS = [
        [0, 128, 255],  // #0080FF
        [0, 170, 255],  // #00AAFF
        [0, 212, 255]   // #00D4FF
    ];

    let lastTrailTime = performance.now();

    function animTrail(now){
        const dt = Math.min((now - lastTrailTime) / 1000, 0.05);
        lastTrailTime = now;
        ctx.clearRect(0, 0, tw, th);

        // Add new trail point at mouse position
        trail.unshift({
            x: mouseX,
            y: mouseY,
            alpha: 0.35,
            size: 3 + Math.random() * 2
        });

        // Trim trail to max length
        while(trail.length > MAX_TRAIL) trail.pop();

        // Draw trail points with fading
        for(let i = trail.length - 1; i >= 0; i--){
            const p = trail[i];
            // Fade alpha based on position in trail
            const fadeFactor = 1 - (i / MAX_TRAIL);
            const a = p.alpha * fadeFactor;
            const sz = p.size * fadeFactor;

            if(a < 0.01) continue;

            const c = TRAIL_COLORS[i % TRAIL_COLORS.length];
            ctx.beginPath();
            ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a})`;
            ctx.shadowColor = `rgba(${c[0]},${c[1]},${c[2]},0.6)`;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        requestAnimationFrame(animTrail);
    }
    requestAnimationFrame(animTrail);
})();
</script>

    pendingDeletes[id] = { timeout: timeout, card: card };
}
function undoDelete(id){
    if(pendingDeletes[id]){
        clearTimeout(pendingDeletes[id].timeout);
        const card = pendingDeletes[id].card;
        if(card) card.classList.remove('deleting');
        delete pendingDeletes[id];
        // Hide toast
        const t = document.getElementById('toast');
        t.className = '';
        t.innerHTML = '';
    }
}
function copiarWiki(id){const d=document.getElementById('dummy');d.value=document.getElementById('wtxt-'+id).innerText;d.select();document.execCommand('copy');showToast('Guia copiada al portapapeles');}
let currentSearchQuery = '';
function filtrarWiki(){
    const q=document.getElementById('wikiSearch').value.toLowerCase();
    currentSearchQuery = q;
    let filtered = dbWiki.filter(i=>i.nombre.toLowerCase().includes(q) || i.pasos.toLowerCase().includes(q));
    if(currentBrandFilter !== 'TODOS'){
        filtered = filtered.filter(i => extractBrand(i.nombre) === currentBrandFilter);
    }
    renderWiki(filtered);
}
function highlightText(text, query){
    if(!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp('(' + escaped + ')', 'gi');
    return text.replace(regex, '<mark>$1</mark>');
}
function renderWiki(lista){
    const area=document.getElementById('wikiResults');
    if(!lista.length){area.innerHTML='<div class="empty-state"><i class="fas fa-mobile-screen"></i><p>No hay guias aun.</p></div>';return;}
    // Sort: pinned favorites first
    const sorted = [...lista].sort((a,b) => {
        const aFav = isFavorite(a.id) ? 0 : 1;
        const bFav = isFavorite(b.id) ? 0 : 1;
        return aFav - bFav;
    });
    area.innerHTML=sorted.map((item,idx)=>{
        const brand = extractBrand(item.nombre);
        const brandColor = getBrandColor(brand);
        const fav = isFavorite(item.id);
        const pinned = fav ? ' pinned' : '';
        const displayName = highlightText(item.nombre, currentSearchQuery);
        const displaySteps = highlightText(item.pasos, currentSearchQuery);
        const poster=item.videoID?`https://img.youtube.com/vi/${item.videoID}/hqdefault.jpg`:'';
        const vid=item.videoID?`<div class="video-thumb" onclick="window.open('https://www.youtube.com/watch?v=${item.videoID}','_blank')"><img src="${poster}" alt="video" loading="lazy"><div class="play-btn"><i class="fas fa-play"></i></div></div>`:'';
        const adm=IS_ADMIN?`<div class="admin-actions"><button class="btn-fav ${fav?'is-fav':''}" onclick="toggleFavorite(${item.id})" title="${fav?'Quitar favorito':'Agregar a favoritos'}"><i class="fas fa-star"></i></button><button class="btn-ed" onclick="editarWiki(${item.id})"><i class="fas fa-pen"></i></button><button class="btn-dl" onclick="borrarWiki(${item.id})"><i class="fas fa-trash"></i></button></div>`:`<div class="admin-actions"><button class="btn-fav ${fav?'is-fav':''}" onclick="toggleFavorite(${item.id})" title="${fav?'Quitar favorito':'Agregar a favoritos'}"><i class="fas fa-star"></i></button></div>`;
        return `<div class="wiki-card${pinned}" data-id="${item.id}" style="animation-delay:${idx*0.04}s"><div style="display:flex;justify-content:space-between;margin-bottom:12px;gap:12px"><div><span class="wiki-card-name">${displayName}</span><span class="brand-badge" style="background:${brandColor}">${brand}</span></div>${adm}</div><div class="wiki-steps-box" id="wtxt-${item.id}">${displaySteps}</div>${vid}<button class="btn btn-purple btn-full" onclick="copiarWiki(${item.id})"><i class="fas fa-copy"></i> Copiar Guia</button></div>`;
    }).join('');
}

// STATISTICS PANEL
function renderStats(){
    const grid = document.getElementById('statsGrid');
    const chart = document.getElementById('brandChart');
    if(!grid || !chart) return;

    // Total guides
    const total = dbWiki.length;

    // Brand distribution
    const brandMap = {};
    dbWiki.forEach(item => {
        const b = extractBrand(item.nombre);
        brandMap[b] = (brandMap[b] || 0) + 1;
    });
    const brandCount = Object.keys(brandMap).length;

    // Last guide added date
    let lastDate = '—';
    if(dbWiki.length > 0){
        const sorted = [...dbWiki].sort((a,b) => b.id - a.id);
        lastDate = new Date(sorted[0].id).toLocaleDateString('es-ES', {day:'2-digit',month:'short',year:'numeric'});
    }

    // Render stat cards
    grid.innerHTML = `
        <div class="stat-card">
            <div class="stat-number">${total}</div>
            <div class="stat-label">Total Guías</div>
        </div>
        <div class="stat-card">
            <div class="stat-number">${brandCount}</div>
            <div class="stat-label">Marcas</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" style="font-size:1.1rem">${lastDate}</div>
            <div class="stat-label">Última Guía</div>
        </div>
    `;

    // Render brand distribution chart
    const maxCount = Math.max(...Object.values(brandMap), 1);
    const sortedBrands = Object.entries(brandMap).sort((a,b) => b[1] - a[1]);
    let chartHtml = '<div style="margin-top:0.5rem">';
    sortedBrands.forEach(([brand, count]) => {
        const color = getBrandColor(brand);
        const pct = Math.round((count / maxCount) * 100);
        chartHtml += `
            <div class="stat-brand-row">
                <span class="brand-badge" style="background:${color};margin-left:0;min-width:70px;justify-content:center">${brand}</span>
                <div class="stat-bar-track" style="flex:1">
                    <div class="stat-bar-fill" style="width:${pct}%;background:${color}"></div>
                </div>
                <span class="stat-brand-count">${count}</span>
            </div>`;
    });
    chartHtml += '</div>';
    chart.innerHTML = chartHtml;
}

// EXPORT FOR TEAM
function exportarEquipo(){
    showToast('Generando archivo...');
    setTimeout(() => {
        try {
            // Clone the entire document HTML
            let html = document.documentElement.outerHTML;
            let out = '<!DOCTYPE html>\n' + html;

            // Update the wiki database with current data
            const dbStr = JSON.stringify(dbWiki);
            out = out.replace(/let dbWiki\s*=\s*\[[\s\S]*?\];/, 'let dbWiki = ' + dbStr + ';');

            // Update favorites in exported copy
            const favStr = JSON.stringify(favorites);
            out = out.replace(/let favorites\s*=\s*JSON\.parse\(localStorage\.getItem\('v14_favorites'\)\s*\|\|\s*'[\[\]]*'\)/, "let favorites = JSON.parse('" + favStr.replace(/'/g, "\\'") + "')");

            // Switch to read-only mode
            out = out.replace('const IS_ADMIN = true;', 'const IS_ADMIN = false; // read-only');

            // Remove the export button from the shared copy
            out = out.replace(/<button[^>]*exportarEquipo\(\)[^>]*>[\s\S]*?<\/button>/g, '');

            // Create and trigger download
            const blob = new Blob([out], {type: 'text/html;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'WikiReset_Equipo_' + new Date().toISOString().slice(0,10) + '.html';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
            showToast('Listo - ' + dbWiki.length + ' guias exportadas');
        } catch(err) {
            console.error('Export error:', err);
            showToast('Error al exportar: ' + err.message);
        }
    }, 300);
}

<!-- CURSOR TRAIL (Blue glow) -->
<script>
(function(){
    const cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:fixed;inset:0;z-index:9997;pointer-events:none;';
    document.body.appendChild(cvs);
    const ctx = cvs.getContext('2d');
    let cw, ch;
    function resizeCvs(){ cw = cvs.width = window.innerWidth; ch = cvs.height = window.innerHeight; }
    window.addEventListener('resize', resizeCvs);
    resizeCvs();

    const TRAIL_LENGTH = 30;
    const trail = [];
    const TRAIL_COLORS = [
        [0,128,255], [0,160,255], [0,200,255],
        [0,212,255], [30,100,240], [60,140,255]
    ];

    let mouseX = -100, mouseY = -100;

    document.addEventListener('mousemove', function(e){
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    let lastT = performance.now();
    function animTrail(now){
        const dt = Math.min((now - lastT)/1000, 0.05);
        lastT = now;

        // Add new point
        trail.unshift({ x: mouseX, y: mouseY, alpha: 0.35, size: 4 });
        if(trail.length > TRAIL_LENGTH) trail.pop();

        ctx.clearRect(0,0,cw,ch);

        for(let i = trail.length - 1; i >= 0; i--){
            const p = trail[i];
            p.alpha -= dt * 1.2;
            p.size -= dt * 6;
            if(p.alpha <= 0 || p.size <= 0){
                trail.splice(i, 1);
                continue;
            }
            const c = TRAIL_COLORS[i % TRAIL_COLORS.length];
            const a = Math.max(0, p.alpha * (1 - i / TRAIL_LENGTH));
            const sz = Math.max(0.5, p.size * (1 - i / TRAIL_LENGTH * 0.5));

            ctx.beginPath();
            ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
            ctx.shadowColor = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.6)';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        requestAnimationFrame(animTrail);
    }
    requestAnimationFrame(animTrail);
})();
</script>
